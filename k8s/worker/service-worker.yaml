apiVersion: v1
kind: Service
metadata:
  name: worker
  annotations:
    ## Le dice al job "kubernetes-service-endpoints" que descubra los pods
    ## detras de este Service. Sin esto, el relabel "keep" lo descarta.
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: worker
  ports:
    - port: 3000
      targetPort: 3000
