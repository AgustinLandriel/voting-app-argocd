## Para EKS !!
apiVersion: v1
kind: Service
metadata:
  name: app-vote-service
  annotations:
    ## Le dice al job "kubernetes-service-endpoints" que descubra los pods
    ## detras de este Service. Sin esto, el relabel "keep" lo descarta.
    prometheus.io/scrape: "true"
    prometheus.io/port: "80"
    prometheus.io/path: "/metrics"
spec:
  type: NodePort
  selector:
    app: app-vote
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
