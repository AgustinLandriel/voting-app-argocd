apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: monitoring
data:
  ## Mismo patron que el resto del stack: la CLAVE es el nombre del
  ## archivo, el VALOR (despues del |) es su contenido crudo.
  ## Montado en /etc/loki, adentro del pod existe /etc/loki/loki.yaml
  loki.yaml: |
    ## Sin multi-tenancy: un solo inquilino, sin header X-Scope-OrgID.
    auth_enabled: false

    server:
      http_listen_port: 3100

    ## Modo monolithic: un unico proceso hace de distributor, ingester,
    ## querier y compactor. Aguanta hasta ~100GB/dia, de sobra para minikube.
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      ## Una sola replica: no hay anillo distribuido que coordinar.
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    ## schema_config es OBLIGATORIO: sin esto Loki no arranca.
    ## Es una LISTA con fechas, lo que permite migrar de esquema sin
    ## perder lo viejo (lee lo anterior con el schema anterior).
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb              # motor del indice (reemplazo de boltdb-shipper)
          object_store: filesystem # donde van los chunks. En prod seria s3
          schema: v13              # formato que pide Loki 3.x
          index:
            prefix: index_
            period: 24h

    limits_config:
      ## 7 dias. OJO: esto solo DECLARA la retencion, no borra nada.
      ## Quien borra es el compactor de mas abajo.
      retention_period: 168h
      ## Sin esto rechaza lineas con timestamp viejo. Molesta al probar.
      reject_old_samples: false

    ## El que efectivamente aplica la retencion. Sin retention_enabled: true
    ## el retention_period de arriba es decorativo.
    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem

    ## Apaga el envio de telemetria a Grafana Labs.
    analytics:
      reporting_enabled: false
