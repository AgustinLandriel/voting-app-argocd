## NUNCA type: LoadBalancer. En EKS un Service LoadBalancer crea un ELB
## fuera del state de Terraform: no aparece en el plan, no se destruye con
## terraform destroy, y factura ~18 USD/mes en silencio.
## Acceso siempre por kubectl port-forward.
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
