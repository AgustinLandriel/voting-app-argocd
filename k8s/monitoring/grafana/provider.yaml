## El "provider": le dice a Grafana DONDE buscar dashboards en disco.
## Los JSON en si NO estan aca: los genera kustomize desde dashboards/*.json
## (ver configMapGenerator en k8s/monitoring/kustomization.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: voting-app
        orgId: 1
        folder: Voting App
        type: file
        ## Misma filosofia que editable: false en el datasource. Se pueden ver
        ## y explorar, pero no guardar desde la UI. La verdad esta en git.
        allowUiUpdates: false
        disableDeletion: true
        ## Grafana re-lee esta carpeta cada 30s, asi que un cambio de dashboard
        ## se refleja SIN reiniciar el pod.
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/dashboards
