apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  ## Mismo patron que el ConfigMap de Prometheus: la CLAVE es el nombre
  ## del archivo, el VALOR (despues del |) es su contenido crudo.
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        ## uid FIJO: los dashboards lo referencian por este valor.
        ## Sin esto Grafana genera uno aleatorio y los paneles quedan huerfanos.
        uid: prometheus
        access: proxy
        ## "prometheus" a secas resuelve porque Grafana vive en el MISMO
        ## namespace. Si estuviera en otro seria prometheus.monitoring.svc
        url: http://prometheus:9090
        isDefault: true
        ## editable: false = no se puede romper desde la UI.
        ## La fuente de verdad es este archivo, no la base de Grafana.
        editable: false

      ## Loki es un datasource INDEPENDIENTE de Prometheus. No dependen
      ## entre si: comparten el modelo de labels y conviven en Grafana.
      - name: Loki
        type: loki
        ## uid fijo, mismo criterio que arriba: si despues armas un
        ## dashboard de logs, lo va a referenciar por este valor.
        uid: loki
        access: proxy
        ## "loki" a secas resuelve porque vive en el MISMO namespace.
        url: http://loki:3100
        ## isDefault queda en Prometheus: Explore abre ahi por defecto.
        editable: false
