apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: voting-app-monitoring
  namespace: argo-cd
spec:
  project: default
  source:
    repoURL: https://github.com/AgustinLandriel/voting-app-argocd.git
    targetRevision: HEAD
    path: k8s/monitoring
    ## Hay un kustomization.yaml en ese path, asi que ArgoCD corre
    ## "kustomize build" en vez de leer los YAML sueltos. Por eso ya no
    ## hace falta directory.recurse: true (y seria ignorado igual).
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
